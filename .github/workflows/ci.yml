name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lightweight:
    name: Lightweight import and data checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lightweight dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.26"

      - name: Compile source
        run: python -m compileall -q .

      - name: Check CLI help does not require heavy backends
        run: python main.py --help

      - name: Run lightweight tests
        run: python -m unittest tests.test_cli_ensemble_validation -v

      - name: Validate CSV artifacts
        run: python tools/validate_artifacts.py --skip-models

  full:
    name: Full dependency checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile source
        run: python -m compileall -q .

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Check SRIR fine-tuning CLI
        run: python -m srir_training.fine_tune --help

      - name: Run SRIR training smoke test
        run: python -m srir_training.smoke_test --cpu

      - name: Validate data and surrogate models
        run: python tools/validate_artifacts.py
